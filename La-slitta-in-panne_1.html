<script>/* ---- Mini runtime: easing, RNG, scene registry, score registry ---- */
(function () {
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, x) => a + (b - a) * x;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const eio = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const eob = (x, o) => { o = o == null ? 1.4 : o; x = clamp01(x) - 1; return 1 + (o + 1) * x * x * x + o * x * x; };
  const rng = (seed) => { let a = (seed * 2654435761) >>> 0 || 1; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const h = (html) => { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; };
  const TextFx = {
    fadeFromRight(el, t, t0, o) {
      o = o || {};
      const stagger = o.stagger == null ? 0.18 : o.stagger, dur = o.dur || 0.7, dx = o.dx == null ? 120 : o.dx;
      if (!el._words) {
        const words = el.textContent.split(/\s+/).filter(Boolean);
        el.innerHTML = words.map((w) => '<span style="display:inline-block;opacity:0">' + w + '</span>').join(' ');
        el._words = Array.from(el.children);
      }
      el._words.forEach((s, i) => { const p = seg(t, t0 + i * stagger, t0 + i * stagger + dur); s.style.opacity = eo(p).toFixed(3); s.style.transform = 'translateX(' + ((1 - eo(p)) * dx).toFixed(1) + 'px)'; });
    },
  };
  const K = { clamp01, seg, lerp, eo, eio, eob, rng, h, TextFx, scenes: {}, scoreFn: null,
    scene(id, def) { K.scenes[id] = def; }, score(fn) { K.scoreFn = fn; } };
  window.__K = K;
})();
</script>
<script>window.W = {
star(cx, cy, R, r) { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; d += (i ? 'L' : 'M') + (cx + q * Math.cos(a)).toFixed(1) + ' ' + (cy + q * Math.sin(a)).toFixed(1); } return d + 'Z'; },

  bind(g) { list.forEach((p, i) => { p.el = g.children[i]; }); },

 };
},
snow(kit, cls, n, seed, v) {

  markup: `<g class='${cls}'>` + list.map(p => `<circle r='${p.s.toFixed(1)}' style='fill:var(--snow);opacity:.8'/>`).join('') + `</g>`,
  bind(g) { list.forEach((p, i) => { p.el = g.children[i]; }); },

},
hills(kit, y, amp, seed, fill) { const r = kit.rng(seed); let d = 'M-40 1100 V' + y.toFixed(0); for (let x = -40; x < 2000; x += 260) d += ' Q' + (x + 130) + ' ' + (y - amp * (0.4 + r() * 0.9)).toFixed(0) + ' ' + (x + 260) + ' ' + (y - amp * 0.3 * (r() - 0.3)).toFixed(0); return `<path d='${d} V1100 Z' style='fill:${fill}'/>`; },
pine(x, y, h, fill) { const w = h * 0.34; let s = `<g><rect x='${(x - h * 0.04).toFixed(1)}' y='${(y - h * 0.16).toFixed(1)}' width='${(h * 0.08).toFixed(1)}' height='${(h * 0.16).toFixed(1)}' style='fill:var(--wood)'/>`; for (let i = 0; i < 3; i++) { const yy = y - h * (0.12 + i * 0.26), ww = w * (1 - i * 0.24); s += `<path d='M${(x - ww).toFixed(1)} ${yy.toFixed(1)} L${x.toFixed(1)} ${(yy - h * 0.42).toFixed(1)} L${(x + ww).toFixed(1)} ${yy.toFixed(1)} Z' style='fill:${fill}'/>`; } return s + `</g>`; },
pines(kit, seed, y, x0, x1, h0, h1, step, fill) { const r = kit.rng(seed); let s = ''; for (let x = x0; x < x1; x += step * (0.7 + r() * 0.6)) s += W.pine(x, y + r() * 10, h0 + r() * (h1 - h0), fill); return s; },
houses(kit, seed, y, x0, x1, step, tone) { const r = kit.rng(seed); let s = ''; for (let x = x0; x < x1; x += step * (0.8 + r() * 0.5)) { const w = 64 + r() * 46, h = 44 + r() * 34, f = (v) => v.toFixed(0); s += `<g><rect x='${f(x + w * 0.65)}' y='${f(y - h - 34)}' width='${f(w * 0.14)}' height='34' style='fill:${tone}'/><rect x='${f(x)}' y='${f(y - h)}' width='${f(w)}' height='${f(h)}' style='fill:${tone}'/><path d='M${f(x - 8)} ${f(y - h)} L${f(x + w / 2)} ${f(y - h - 36)} L${f(x + w + 8)} ${f(y - h)} Z' style='fill:var(--snow)'/><rect x='${f(x + w * 0.16)}' y='${f(y - h * 0.72)}' width='${f(w * 0.22)}' height='${f(h * 0.34)}' style='fill:var(--glow)'/><rect x='${f(x + w * 0.58)}' y='${f(y - h * 0.72)}' width='${f(w * 0.22)}' height='${f(h * 0.34)}' style='fill:var(--glow)'/></g>`; } return s; },
moon(id, r) { return `<g class='${id}'><defs><radialGradient id='${id}-h'><stop offset='0.3' style='stop-color:var(--glow);stop-opacity:.55'/><stop offset='1' style='stop-color:var(--glow);stop-opacity:0'/></radialGradient></defs><circle r='${r * 3}' fill='url(#${id}-h)'/><circle r='${r}' style='fill:var(--glow)'/><circle cx='${-r * 0.3}' cy='${-r * 0.2}' r='${r * 0.2}' style='fill:var(--warm);opacity:.35'/><circle cx='${r * 0.35}' cy='${r * 0.3}' r='${r * 0.14}' style='fill:var(--warm);opacity:.3'/></g>`; },
popup(kit) { return `<path d='M-430 0 L-330 -170 L-250 -110 L-150 -250 L-40 -140 L60 -210 L170 -120 L290 -230 L430 -90 V0 Z' style='fill:color-mix(in srgb, var(--glow) 50%, var(--paper))'/>` + W.pines(kit, 3, 0, -410, 420, 90, 150, 70, 'color-mix(in srgb, var(--elf) 70%, var(--paper))') + W.houses(kit, 5, 0, -300, 280, 120, 'var(--cover)') + W.pines(kit, 8, 10, -430, 430, 110, 190, 150, 'var(--pine)') + `<path d='${W.star(0, -330, 38, 16)}' style='fill:var(--glow)'/>`; },
book(kit, cls) {
 const lines = `<path d='M60 -250 H470 M60 -205 H420 M60 -160 H460 M60 -115 H400' style='stroke:var(--warm);stroke-width:8;stroke-linecap:round;opacity:.3;fill:none'/>`;

  `<defs><radialGradient id='${cls}-gl'><stop offset='0' style='stop-color:var(--glow);stop-opacity:.95'/><stop offset='.45' style='stop-color:var(--glow);stop-opacity:.35'/><stop offset='1' style='stop-color:var(--glow);stop-opacity:0'/></radialGradient></defs>` +
  `<circle class='${cls}-bglow' r='820' cy='-60' fill='url(#${cls}-gl)' style='opacity:0'/>` +
  `<g class='${cls}-lbase' style='opacity:0'><rect x='-566' y='-340' width='566' height='680' rx='14' style='fill:var(--cover)'/><rect x='-548' y='-326' width='548' height='652' rx='6' style='fill:var(--paper)'/><g transform='scale(-1 1)'>${lines}</g></g>` +
  `<rect x='-14' y='-340' width='28' height='680' style='fill:var(--cover)'/><rect x='0' y='-340' width='566' height='680' rx='14' style='fill:var(--cover)'/><rect x='0' y='-326' width='548' height='652' rx='6' style='fill:var(--paper)'/>` +
  `<g class='${cls}-cov'><g class='${cls}-covo'><rect x='0' y='-340' width='566' height='680' rx='14' style='fill:var(--cover)'/><rect x='22' y='-318' width='522' height='636' rx='8' style='fill:none;stroke:var(--warm);stroke-width:6'/><circle cx='283' cy='-30' r='160' style='fill:none;stroke:var(--warm);stroke-width:4'/><path d='${W.star(283, -30, 120, 52)}' style='fill:var(--glow)'/><circle class='${cls}-clasp' cx='548' cy='0' r='20' style='fill:var(--glow)'/></g><g class='${cls}-covi' style='opacity:0'><rect x='0' y='-340' width='566' height='680' rx='14' style='fill:var(--cover)'/><rect x='16' y='-324' width='534' height='648' rx='6' style='fill:var(--paper)'/></g></g>` +

bookPose(g, cls, o, fl, pop) {

<script>/* ---- Player: scenes, timeline, controls ---- */
(function () {
  const K = window.__K, A = window.__A;
  const SC = [['book', 30], ['emerge', 25], ['eve', 25], ['crack', 30], ['snow', 25], ['quest', 35], ['forge', 35], ['fit', 25], ['flight', 40], ['end', 30]];
  let start = 0; const list = SC.map(([id, dur]) => { const o = { id, dur, start, def: K.scenes[id] }; start += dur; return o; });
  const TOTAL = start;
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), frame = $('frame'), app = $('app');
  let ready = false, cur = -1, playing = false, pos = 0, lastErr = null;

  for (const s of list) {
    const el = document.createElement('div'); el.className = 'scene'; el.style.display = 'none'; stage.appendChild(el);
    s.el = el; s.kit = Object.assign(Object.create(K), { stage: el });
    try { s.def.init.call(s.def, s.kit); } catch (e) { lastErr = e; console.error('init', s.id, e); }
  }
  ready = true; $('loading').style.display = 'none';

  function fit() {
    const r = frame.getBoundingClientRect(), sc = Math.min(r.width / 1920, r.height / 1080);
    stage.style.transform = 'translate(-50%,-50%) scale(' + sc + ')';
  }
  addEventListener('resize', fit); fit();

  const clock = () => (A.ctx ? A.clock() : pos);
  function draw(p) {
    p = Math.min(TOTAL - 0.001, Math.max(0, p));
    let i = 0; while (i < list.length - 1 && p >= list[i + 1].start) i++;
    if (i !== cur) { if (cur >= 0) list[cur].el.style.display = 'none'; list[i].el.style.display = 'block'; cur = i; }
    const s = list[i], lt = p - s.start;
    s.el.style.opacity = Math.max(0, Math.min(1, lt / 0.5, (s.dur - lt) / 0.5)).toFixed(3);
    try { s.def.render.call(s.def, lt, s.kit); } catch (e) { if (!s.err) console.error('render', s.id, e); s.err = e; }
    $('seek').value = p.toFixed(2); $('time').textContent = fmt(p) + ' / ' + fmt(TOTAL);
    $('chap').textContent = s.id === 'book' ? '' : '';
  }
  const fmt = (x) => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');

  function loop() {
    if (playing) {
      pos = Math.min(TOTAL, clock());
      if (pos >= TOTAL - 0.02) { pause(); pos = TOTAL; $('big').style.display = 'flex'; $('bigtxt').textContent = 'Rivedi la storia'; }
    }
    draw(pos); requestAnimationFrame(loop);
  }
  function play() {
    if (pos >= TOTAL - 0.05) pos = 0;
    A.init(); A.start(pos);

  }

  $('mute').onclick = () => { A.setMuted(!A.muted); $('mute').textContent = A.muted ? '🔇' : '🔊'; if (!A.ctx) A.muted = A.muted; };
  $('fs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else app.requestFullscreen && app.requestFullscreen(); };
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === 'ArrowRight') seek(pos + 5); else if (e.code === 'ArrowLeft') seek(pos - 5);
  });
  frame.onclick = () => { if ($('big').style.display === 'none') (playing ? pause() : play()); };
  draw(0); requestAnimationFrame(loop);
  window.__film = { play, pause, seek, TOTAL, errors: () => list.map((s) => s.err && s.id).filter(Boolean) };
})();
</script>
